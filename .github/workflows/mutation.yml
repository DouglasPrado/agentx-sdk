name: Mutation Testing

# Stryker e LENTO (pode levar 30+ min). Nao rodamos em todo PR — so:
# - workflow_dispatch: manual quando o dev quiser
# - cron semanal: pega regressoes na qualidade dos testes ao longo do tempo
#
# O modo incremental (incrementalFile no stryker.config.json) acelera runs
# subsequentes — so re-mutaciona arquivos que mudaram desde a ultima run.

on:
  schedule:
    # Domingo 04:00 UTC — fora de pico, dia diferente do Semgrep/CodeQL/gitleaks
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Stryker
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mutation testing
        run: pnpm test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-${{ github.run_id }}
          path: reports/mutation/
          retention-days: 30
